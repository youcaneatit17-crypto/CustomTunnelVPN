name: Build Custom Tunnel APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Compile libsshcore.so
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cd $GITHUB_WORKSPACE/go-core
          go mod tidy
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libsshcore.so

      - name: Generate Gradle Wrapper & Build Debug APK
        run: |
          cd $GITHUB_WORKSPACE
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CustomTunnelVPN-arm64
          path: app/build/outputs/apk/debug/app-debug.apk
