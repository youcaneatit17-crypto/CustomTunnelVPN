name: Build Custom Tunnel APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Go (for Modern SSH Core)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;26.1.10909125'

      - name: Compile Native Binaries (libsshcore.so & libtun2socks.so, preserve 1FTunnel libdnstt.so)
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a

          # 1. Build Modern Go SSH + SOCKS5 Core (libsshcore.so)
          cd $GITHUB_WORKSPACE/go-core
          go mod tidy
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libsshcore.so

          # 2. Build BadVPN tun2socks (libtun2socks.so)
          git clone https://github.com/ambrop72/badvpn.git /tmp/badvpn
          cd /tmp/badvpn
          find . -name "CMakeLists.txt" -exec sed -i 's/\bpthread\b//g; s/\brt\b//g' {} +
          mkdir -p /tmp/badvpn/build && cd /tmp/badvpn/build
          cmake .. \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/26.1.10909125/build/cmake/android.toolchain.cmake \
            -DCMAKE_C_FLAGS="-w -DBADVPN_THREADWORK_USE_PTHREAD -DBADVPN_LINUX -DBADVPN_BREACTOR_BADVPN -DBADVPN_USE_EPOLL -DBADVPN_USE_SIGNALFD -DBADVPN_LITTLE_ENDIAN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DBUILD_NOTHING_BY_DEFAULT=1 \
            -DBUILD_TUN2SOCKS=1
          make -j$(nproc)
          cp tun2socks/badvpn-tun2socks $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libtun2socks.so

      - name: Generate Gradle Wrapper & Build Debug APK
        run: |
          cd $GITHUB_WORKSPACE
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CustomTunnelVPN-arm64
          path: app/build/outputs/apk/debug/app-debug.apk
